<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDMAIL - Matte Dark Email Suite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-box {
            background: #2d2d2d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .title h1 {
            font-size: 18px;
            color: #ffffff;
        }
        .title p {
            font-size: 12px;
            color: #888;
        }
        .email-box {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .email-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .email-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
        }
        button {
            background: #2d2d2d;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background: #3d3d3d;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
            width: 100%;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .inbox-section {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        .inbox-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .msg-item {
            background: #222;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s;
        }
        .msg-item:hover {
            border-color: #3b82f6;
        }
        .msg-from {
            font-size: 12px;
            color: #3b82f6;
            margin-bottom: 3px;
        }
        .msg-subject {
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }
        .empty-inbox {
            color: #666;
            text-align: center;
            padding: 40px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-box">CD</div>
                <div class="title">
                    <h1>CDMAIL</h1>
                    <p>Matte Dark Email Suite</p>
                </div>
            </div>
        </div>

        <!-- Active Email Box -->
        <div class="email-box">
            <div class="email-label">Active CDMAIL Address</div>
            <div class="email-input-group">
                <input type="text" id="email-address" readonly value="Generating...">
                <button onclick="copyEmail()">Copy</button>
            </div>
            <button class="btn-primary" onclick="generateNewEmail()">Generate New Address</button>
        </div>

        <!-- Inbox Section -->
        <div class="inbox-section">
            <div class="inbox-header">
                <span>Inbox</span>
                <span id="refresh-status" style="font-size: 11px; color: #666;">Auto-refreshing...</span>
            </div>
            <div id="inbox-list" class="inbox-list">
                <div class="empty-inbox">Inbox is empty. Waiting for emails...</div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentEmail = "";
        let emailLogin = "";
        let emailDomain = "";

        // 1. අලුත් ඊමේල් ලිපිනයක් සකස් කිරීම
        async function generateNewEmail() {
            try {
                const response = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
                const data = await response.json();
                currentEmail = data[0];
                
                const parts = currentEmail.split('@');
                emailLogin = parts[0];
                emailDomain = parts[1];

                document.getElementById('email-address').value = currentEmail;
                document.getElementById('inbox-list').innerHTML = '<div class="empty-inbox">Inbox is empty. Waiting for emails...</div>';
                
            } catch (error) {
                console.error("Error generating email:", error);
            }
        }

        // 2. ඊමේල් ලිපිනය Copy කරගැනීම
        function copyEmail() {
            const emailInput = document.getElementById('email-address');
            emailInput.select();
            emailInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(emailInput.value);
            alert("Copied to clipboard: " + emailInput.value);
        }

        // 3. Inbox එක පරීක්ෂා කිරීම
        async function checkInbox() {
            if (!emailLogin || !emailDomain) return;

            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${emailLogin}&domain=${emailDomain}`);
                const messages = await response.json();
                
                const inboxContainer = document.getElementById('inbox-list');
                if (!inboxContainer) return;

                if (messages.length === 0) {
                    return; // කිසිවක් නැත්නම් වෙනස් නොකරයි
                }

                inboxContainer.innerHTML = "";

                messages.forEach(msg => {
                    const msgItem = document.createElement('div');
                    msgItem.className = 'msg-item';
                    msgItem.innerHTML = `
                        <div class="msg-from">From: ${msg.from}</div>
                        <div class="msg-subject">${msg.subject}</div>
                    `;
                    msgItem.onclick = () => readMessage(msg.id);
                    inboxContainer.appendChild(msgItem);
                });

            } catch (error) {
                console.error("Error fetching inbox:", error);
            }
        }

        // 4. නිශ්චිත පණිවිඩයක් කියවීම
        async function readMessage(id) {
            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${emailLogin}&domain=${emailDomain}&id=${id}`);
                const msgData = await response.json();
                
                alert(`From: ${msgData.from}\nSubject: ${msgData.subject}\n\n${msgData.textBody}`);
            } catch (error) {
                console.error("Error reading message:", error);
            }
        }

        // මුල් වරට Load වූ විට සහ තත්පර 10කට වරක් Refresh වීම
        window.onload = () => {
            generateNewEmail();
            setInterval(checkInbox, 10000);
        };
    </script>
</body>
</html>
