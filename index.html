<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDMAIL - Matte Dark Email Suite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-box {
            background: #2d2d2d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .title h1 {
            font-size: 18px;
            color: #ffffff;
        }
        .title p {
            font-size: 12px;
            color: #888;
        }
        .email-box {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .email-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .email-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
        }
        button {
            background: #2d2d2d;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        button:hover {
            background: #3d3d3d;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
            width: 100%;
            font-weight: bold;
            padding: 10px;
            margin-top: 5px;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .sub-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
        }
        .sub-actions a {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
        }
        .sub-actions a:hover {
            text-decoration: underline;
        }
        .danger-btn {
            color: #ef4444;
            background: none;
            padding: 0;
            font-size: 12px;
        }
        .danger-btn:hover {
            background: none;
            color: #dc2626;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
            color: #aaa;
            background: #181818;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }
        .toolbar-right {
            display: flex;
            gap: 12px;
        }
        .toolbar-right a {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: none;
        }
        .toolbar-right a:hover {
            text-decoration: underline;
        }
        .inbox-section {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            min-height: 180px;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        .inbox-list {
            max-height: 220px;
            overflow-y: auto;
        }
        .msg-item {
            background: #222;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s;
        }
        .msg-item:hover {
            border-color: #3b82f6;
        }
        .msg-from {
            font-size: 12px;
            color: #3b82f6;
            margin-bottom: 3px;
        }
        .msg-subject {
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }
        .empty-inbox {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-box">CD</div>
                <div class="title">
                    <h1>CDMAIL</h1>
                    <p>Matte Dark Email Suite</p>
                </div>
            </div>
        </div>

        <!-- Active Email Box -->
        <div class="email-box">
            <div class="email-label">
                <span>Active CDMAIL Address</span>
                <span style="color: #10b981; font-size: 10px;">Live Mode</span>
            </div>
            <div class="email-input-group">
                <input type="text" id="email-address" readonly value="Generating...">
                <button onclick="copyEmail()">Copy</button>
            </div>
            
            <div class="sub-actions">
                <a onclick="customizeAddress()">Customize Address</a>
                <button class="danger-btn" onclick="deleteMailbox()">Delete Mailbox</button>
            </div>

            <button class="btn-primary" onclick="generateNewEmail()">Generate New Address</button>
        </div>

        <!-- Toolbar (Status & Test Mail) -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="status-dot"></div>
                <span id="listening-text">Listening on @1secmail.com</span>
            </div>
            <div class="toolbar-right">
                <a onclick="checkInbox()">Refresh</a>
                <a onclick="addTestMail()">+ Add Test Mail</a>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="inbox-section">
            <div class="inbox-header">
                <span>Inbox</span>
                <span id="msg-count" style="font-size: 12px; color: #666;">0 messages</span>
            </div>
            <div id="inbox-list" class="inbox-list">
                <div class="empty-inbox">Inbox is empty. Waiting for emails...</div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentEmail = "";
        let emailLogin = "";
        let emailDomain = "";
        let customMessages = []; // Test mails සඳහා

        function randomString(length) {
            let result = '';
            const characters = 'abcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // 1. අලුත් ඊමේල් ලිපිනයක් සකස් කිරීම
        function generateNewEmail() {
            const randomUser = randomString(8);
            const domains = ['1secmail.com', '1secmail.org', '1secmail.net'];
            const randomDomain = domains[Math.floor(Math.random() * domains.length)];
            
            emailLogin = randomUser;
            emailDomain = randomDomain;
            currentEmail = emailLogin + '@' + emailDomain;
            customMessages = []; // අලුත් මේල් එකක් හදනකොට පරණ ටෙස්ට් මේල් මකයි

            document.getElementById('email-address').value = currentEmail;
            document.getElementById('listening-text').innerText = 'Listening on @' + emailDomain;
            renderInbox([]);
        }

        // 2. අභිරුචි ඊමේල් ලිපිනයක් සකස් කිරීම (Customize Address)
        function customizeAddress() {
            const customName = prompt("Enter your custom username prefix:", randomString(6));
            if (customName && customName.trim() !== "") {
                const cleanName = customName.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                emailLogin = cleanName;
                emailDomain = '1secmail.com';
                currentEmail = emailLogin + '@' + emailDomain;
                customMessages = [];

                document.getElementById('email-address').value = currentEmail;
                document.getElementById('listening-text').innerText = 'Listening on @' + emailDomain;
                renderInbox([]);
                alert("Custom address created successfully!");
            }
        }

        // 3. Mailbox එක මකා දැමීම (Delete Mailbox)
        function deleteMailbox() {
            if (confirm("Are you sure you want to delete this mailbox?")) {
                generateNewEmail();
            }
        }

        // 4. ඊමේල් ලිපිනය Copy කරගැනීම
        function copyEmail() {
            const emailInput = document.getElementById('email-address');
            emailInput.select();
            emailInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(emailInput.value);
            alert("Copied to clipboard: " + emailInput.value);
        }

        // 5. Test Mail එකක් එකතු කිරීම (Instant Testing)
        function addTestMail() {
            const sampleMsgs = [
                { id: 'test_' + Date.now(), from: 'security@verify-1sec.com', subject: 'Your Verification Code is 849201', textBody: 'Hello, your confirmation code is 849201. Do not share this with anyone.' },
                { id: 'test_' + (Date.now()+1), from: 'welcome@cdmail.net', subject: 'Welcome to CDMAIL Suite!', textBody: 'Thank you for using CDMAIL. Your temporary inbox is fully operational.' }
            ];
            const randomMsg = sampleMsgs[Math.floor(Math.random() * sampleMsgs.length)];
            customMessages.unshift(randomMsg);
            renderInbox(customMessages);
        }

        // 6. Inbox එක පෙන්වීම සහ Refresh කිරීම
        async function checkInbox() {
            if (!emailLogin || !emailDomain) return;

            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${emailLogin}&domain=${emailDomain}`);
                if (!response.ok) return;
                
                const apiMessages = await response.json();
                
                // API එකෙන් එන මැසේජස් සහ ටෙස්ට් මැසේජස් එකතු කිරීම
                const allMessages = [...customMessages, ...apiMessages];
                renderInbox(allMessages);

            } catch (error) {
                renderInbox(customMessages); // දෝෂයක් ආවොත් ටෙස්ට් මේල් හෝ හිස් තත්වය පෙන්වයි
            }
        }

        function renderInbox(messages) {
            const inboxContainer = document.getElementById('inbox-list');
            const msgCount = document.getElementById('msg-count');
            if (!inboxContainer) return;

            msgCount.innerText = messages.length + (messages.length === 1 ? ' message' : ' messages');

            if (!messages || messages.length === 0) {
                inboxContainer.innerHTML = '<div class="empty-inbox">Inbox is empty. Waiting for emails...</div>';
                return;
            }

            inboxContainer.innerHTML = "";
            messages.forEach(msg => {
                const msgItem = document.createElement('div');
                msgItem.className = 'msg-item';
                msgItem.innerHTML = `
                    <div class="msg-from">From: ${msg.from}</div>
                    <div class="msg-subject">${msg.subject}</div>
                `;
                msgItem.onclick = () => readMessage(msg.id, msg);
                inboxContainer.appendChild(msgItem);
            });
        }

        // 7. පණිවිඩයක් විවෘත කර බැලීම
        async function readMessage(id, localMsg) {
            if (localMsg && localMsg.textBody) {
                alert(`From: ${localMsg.from}\nSubject: ${localMsg.subject}\n\n${localMsg.textBody}`);
                return;
            }

            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${emailLogin}&domain=${emailDomain}&id=${id}`);
                const msgData = await response.json();
                
                alert(`From: ${msgData.from}\nSubject: ${msgData.subject}\n\n${msgData.textBody}`);
            } catch (error) {
                alert("Could not load message details.");
            }
        }

        // වෙබ් අඩුව ලෝඩ් වූ වහාම ක්‍රියාත්මක වීම
        window.onload = () => {
            generateNewEmail();
            setInterval(checkInbox, 10000); // සෑම තත්පර 10කට වරක් ස්වයංක්‍රීයව පරීක්ෂා කරයි
        };
    </script>
</body>
</html>
