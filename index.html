<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDMAIL - Matte Dark Email Suite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #121824;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e293b;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-box {
            background: #1e293b;
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #334155;
        }
        .title h1 {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }
        .title p {
            font-size: 11px;
            color: #94a3b8;
        }
        .notification-icon {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
        }
        .email-card {
            background: #161f30;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .email-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .email-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.8px;
            font-weight: 600;
        }
        .mode-badge {
            background: #064e3b;
            color: #34d399;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 500;
            border: 1px solid #065f46;
        }
        .email-input-row {
            display: flex;
            align-items: center;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 4px 4px 4px 12px;
            margin-bottom: 12px;
        }
        .email-input-row input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .btn-action-group {
            display: flex;
            gap: 6px;
        }
        .btn-copy {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .icon-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid #1e293b;
            padding-top: 12px;
        }
        .custom-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            background: #161f30;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #1e293b;
            margin-bottom: 15px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
        }
        .status-right {
            display: flex;
            gap: 12px;
        }
        .status-right span {
            color: #34d399;
            cursor: pointer;
        }
        .inbox-card {
            background: #161f30;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #fff;
            font-weight: 600;
        }
        .msg-count-badge {
            background: #1e293b;
            color: #94a3b8;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .inbox-list {
            max-height: 180px;
            overflow-y: auto;
        }
        .empty-inbox {
            color: #64748b;
            text-align: center;
            padding: 25px 0;
            font-size: 12px;
        }
        .msg-item {
            background: #0b0f19;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #1e293b;
        }
        .msg-from {
            font-size: 11px;
            color: #34d399;
            margin-bottom: 2px;
        }
        .msg-subject {
            font-size: 12px;
            color: #fff;
        }
        .preview-card {
            background: #161f30;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 30px 15px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-box">CD</div>
                <div class="title">
                    <h1>CDMAIL</h1>
                    <p>Matte Dark Email Suite</p>
                </div>
            </div>
            <div class="notification-icon" onclick="alert('Notifications active')">🔔</div>
        </div>

        <!-- Active Email Card -->
        <div class="email-card">
            <div class="email-card-header">
                <span class="email-label">Active CDMAIL Address</span>
                <span class="mode-badge">🛡️ Manual Erasure Mode</span>
            </div>
            
            <div class="email-input-row">
                <input type="text" id="email-address" readonly value="Generating...">
                <div class="btn-action-group">
                    <button class="btn-copy" onclick="copyEmail()">Copy</button>
                    <button class="icon-btn" onclick="generateNewEmail()" title="Generate New">🔄</button>
                </div>
            </div>

            <div class="card-actions-row">
                <button class="custom-btn" onclick="customizeAddress()">✏️ Customize Address</button>
                <button class="delete-btn" onclick="deleteMailbox()">Delete Mailbox</button>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <div class="status-dot"></div>
                <span id="listening-text">Active • Listening on @cdmail.net</span>
            </div>
            <div class="status-right">
                <span onclick="checkInbox()">Refresh Inbox</span>
                <span onclick="addTestMail()">+ Add Test Mail</span>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="inbox-card">
            <div class="inbox-header">
                <span>Inbox</span>
                <span id="msg-count" class="msg-count-badge">0 messages</span>
            </div>
            <div id="inbox-list" class="inbox-list">
                <div class="empty-inbox">Inbox is empty. Waiting for emails...</div>
            </div>
        </div>

        <!-- Bottom Preview Box -->
        <div class="preview-card">
            Select a message to view content
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentEmail = "";
        let emailLogin = "";
        let emailDomain = "cdmail.net";
        let customMessages = [];

        function randomString(length) {
            let result = '';
            const characters = 'abcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        function generateNewEmail() {
            const randomUser = randomString(8);
            emailLogin = randomUser;
            currentEmail = emailLogin + '@' + emailDomain;
            customMessages = [];

            document.getElementById('email-address').value = currentEmail;
            document.getElementById('listening-text').innerText = 'Active • Listening on @' + emailDomain;
            renderInbox([]);
        }

        function customizeAddress() {
            const customName = prompt("Enter your custom username prefix:", randomString(6));
            if (customName && customName.trim() !== "") {
                const cleanName = customName.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                emailLogin = cleanName;
                currentEmail = emailLogin + '@' + emailDomain;
                customMessages = [];

                document.getElementById('email-address').value = currentEmail;
                renderInbox([]);
                alert("Custom address created successfully!");
            }
        }

        function deleteMailbox() {
            if (confirm("Are you sure you want to delete this mailbox?")) {
                generateNewEmail();
            }
        }

        function copyEmail() {
            const emailInput = document.getElementById('email-address');
            emailInput.select();
            emailInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(emailInput.value);
            alert("Copied to clipboard: " + emailInput.value);
        }

        function addTestMail() {
            const sampleMsgs = [
                { id: 'test_' + Date.now(), from: 'security@verify.com', subject: 'Your Verification Code is 584920', textBody: 'Hello, your confirmation code is 584920.' },
                { id: 'test_' + (Date.now()+1), from: 'welcome@cdmail.net', subject: 'Welcome to CDMAIL Suite!', textBody: 'Your temporary inbox is fully operational and secure.' }
            ];
            const randomMsg = sampleMsgs[Math.floor(Math.random() * sampleMsgs.length)];
            customMessages.unshift(randomMsg);
            renderInbox(customMessages);
        }

        async function checkInbox() {
            if (!emailLogin) return;

            try {
                // 1secmail API එක භාවිතයෙන් සැබෑ ඊමේල් පරීක්ෂා කිරීම (cdmail.net වෙනුවට api domain එකට map කරයි)
                const apiDomain = '1secmail.com';
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${emailLogin}&domain=${apiDomain}`);
                if (!response.ok) return;
                
                const apiMessages = await response.json();
                const allMessages = [...customMessages, ...apiMessages];
                renderInbox(allMessages);
            } catch (error) {
                renderInbox(customMessages);
            }
        }

        function renderInbox(messages) {
            const inboxContainer = document.getElementById('inbox-list');
            const msgCount = document.getElementById('msg-count');
            if (!inboxContainer) return;

            msgCount.innerText = messages.length + (messages.length === 1 ? ' message' : ' messages');

            if (!messages || messages.length === 0) {
                inboxContainer.innerHTML = '<div class="empty-inbox">Inbox is empty. Waiting for emails...</div>';
                return;
            }

            inboxContainer.innerHTML = "";
            messages.forEach(msg => {
                const msgItem = document.createElement('div');
                msgItem.className = 'msg-item';
                msgItem.innerHTML = `
                    <div class="msg-from">From: ${msg.from}</div>
                    <div class="msg-subject">${msg.subject}</div>
                `;
                msgItem.onclick = () => alert(`From: ${msg.from}\nSubject: ${msg.subject}\n\n${msg.textBody || 'Sample or API message content.'}`);
                inboxContainer.appendChild(msgItem);
            });
        }

        window.onload = () => {
            generateNewEmail();
            setInterval(checkInbox, 10000);
        };
    </script>
</body>
</html>
